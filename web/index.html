<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 日报 · AI Gazette — 每日人工智能资讯</title>
  <meta name="description" content="每日自动采集全网 AI 资讯：机器之心、量子位、36氪、InfoQ、TechCrunch、The Verge、arXiv。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗞️</text></svg>" />
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-top">
        <span class="dateline" id="dateline">—</span>
        <span class="motto">每日 07:30 自动采集 · 多源聚合 · 可信度评分</span>
      </div>
      <h1 class="brand"><span class="brand-zh">AI 日报</span><span class="brand-en">The AI Gazette</span></h1>
      <nav class="filters" aria-label="筛选">
        <div class="filter-group" id="view-tabs" role="tablist">
          <button class="tab active" data-view="feed" role="tab">资讯流</button>
          <button class="tab" data-view="brief" role="tab">每日简报</button>
        </div>
        <div class="filter-group" id="lang-tabs" role="tablist">
          <button class="tab active" data-lang="" role="tab">全部</button>
          <button class="tab" data-lang="zh" role="tab">中文</button>
          <button class="tab" data-lang="en" role="tab">English</button>
        </div>
        <div class="archive-nav">
          <button id="prev-day" class="nav-btn" title="前一天">← 前一日</button>
          <span id="current-day" class="current-day">—</span>
          <button id="next-day" class="nav-btn" title="后一天">后一日 →</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="feed-view">
      <section id="top-section" class="top-section" hidden>
        <h2 class="section-title">今日头条</h2>
        <div id="top-stories" class="top-grid"></div>
      </section>

      <section class="feed-section">
        <h2 class="section-title" id="feed-title">全部资讯</h2>
        <div id="source-chips" class="source-chips"></div>
        <div id="feed" class="feed" aria-live="polite"></div>
        <div id="feed-state" class="feed-state"></div>
        <div class="load-more-wrap">
          <button id="load-more" class="load-more" hidden>加载更多</button>
        </div>
      </section>
    </div>

    <div id="brief-view" hidden>
      <div id="brief-content" class="brief-content"></div>
      <div id="brief-state" class="feed-state"></div>
    </div>
  </main>

  <footer class="footer">
    <p>数据源：机器之心 · 量子位 · 36氪 · InfoQ · TechCrunch · The Verge · arXiv</p>
    <p>流水线：RSS 采集 → 时效过滤 → AI 相关性过滤 → SimHash 去重 → 结构化抽取 → 可信度评分</p>
    <p>由腾讯云 CloudBase 驱动（定时云函数 + 云数据库 + 静态托管） ·
       <a id="github-link" href="https://github.com/hhy673854913-max/ai-daily" target="_blank" rel="noopener">GitHub 仓库</a>
    </p>
  </footer>

  <script src="./config.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
