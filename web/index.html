<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 日报 · AI Gazette — 每日精选 10 条人工智能资讯</title>
  <meta name="description" content="资深 AI 编辑每日精选 10 条最有价值的 AI 资讯，附星级评价。数据源：机器之心、量子位、36氪、InfoQ、TechCrunch、The Verge、arXiv。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗞️</text></svg>" />
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-top">
        <span class="dateline" id="dateline">—</span>
        <span class="motto">每日 07:30 自动采集 · 资深编辑精选 10 条 · 星级评价</span>
      </div>
      <h1 class="brand"><span class="brand-zh">AI 日报</span><span class="brand-en">The AI Gazette</span></h1>
      <nav class="filters" aria-label="导航">
        <div class="filter-group" id="view-tabs" role="tablist">
          <button class="tab active" data-view="daily" role="tab">每日简报</button>
          <button class="tab" data-view="history" role="tab">历史简报</button>
        </div>
        <div class="archive-nav" id="day-nav">
          <button id="prev-day" class="nav-btn" title="前一天">← 前一日</button>
          <span id="current-day" class="current-day">—</span>
          <button id="next-day" class="nav-btn" title="后一天">后一日 →</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="daily-view">
      <p class="pipeline-report" id="pipeline-report"></p>
      <div id="brief-list" class="brief-list" aria-live="polite"></div>
      <div id="daily-state" class="feed-state"></div>
    </div>

    <div id="history-view" hidden>
      <h2 class="section-title">历史简报</h2>
      <div id="history-list" class="history-list"></div>
      <div id="history-state" class="feed-state"></div>
    </div>
  </main>

  <footer class="footer">
    <p>数据源：机器之心 · 量子位 · 36氪 · InfoQ · TechCrunch · The Verge · arXiv</p>
    <p>流水线：RSS 采集 → 时效过滤 → AI 相关性过滤 → SimHash 去重 → 结构化抽取 → 可信度评分 → 精选评级</p>
    <p>由腾讯云 CloudBase 驱动（定时云函数 + 云数据库 + 静态托管） ·
       <a id="github-link" href="https://github.com/hhy673854913-max/ai-daily" target="_blank" rel="noopener">GitHub 仓库</a>
    </p>
  </footer>

  <script src="./config.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
